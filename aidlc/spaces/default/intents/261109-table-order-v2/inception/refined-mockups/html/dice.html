<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Chef's Dice</title><link rel="stylesheet" href="styles.css"></head>
<body><main>
<h1>Chef's Dice</h1><p class="muted">Pick a mood, then roll or shake your phone.</p>
<div class="pills"><button class="pill active">Light</button><button class="pill">Hearty</button><button class="pill">Sweet</button><button class="pill">Surprise me</button></div>
<div class="stage" style="height:200px"><div class="dice"><div class="die">🎲</div><div class="die">🍽</div></div></div>
<button class="btn block">Roll the dice</button><p></p>
<article class="card item"><div class="plate">🥗</div><div><div class="name">House Salad</div><div class="muted">The chef suggests this for a light mood.</div><div class="pricerow"><span class="price">$5.00</span></div></div></article>
<div class="row"><button class="btn">Add to cart</button><button class="btn ghost">Roll again</button></div>
</main><nav class="tabs"><div class="tab active">Menu</div><div class="tab">Cart</div><div class="tab">My orders</div></nav></body></html>
